name: AI Daily

on:
  schedule:
    # 07:00 北京时间（UTC 23:00 前一天）。改时间只需改这一行。
    - cron: "0 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ai-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate and push
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          MAX_ITEMS: "5"
        run: python daily.py

      # 提交去重历史：既让明天不重复，也避免仓库 60 天无活动被停用定时任务
      - name: Persist dedupe history
        run: |
          git config user.name "ai-daily-bot"
          git config user.email "ai-daily-bot@users.noreply.github.com"
          mkdir -p state
          git add state/history.json || true
          if git diff --staged --quiet; then
            echo "no state change"
          else
            git commit -m "chore: update dedupe history"
            git push
          fi
